    logged_in_marker: "TODO-verify: [data-testid='header-profile']"
    login_wall_selectors: ["TODO: sign-in modal selector"]
    captcha_selectors: ["TODO: captcha frame selector"]
    block_texts: []
    room_template:
      search_price: "TODO-verify: .hprt-table tr:has(.hprt-roomtype-link:has-text('{room}')) .bui-price-display__value"
      # NO CLICKS. Booking.com's room table already shows the price AND
      # "+ Rs N taxes and charges" (and Genius prices when logged in), so the
      # deep check reads them right there: no room-count dropdown, no Reserve.
      steps: []
