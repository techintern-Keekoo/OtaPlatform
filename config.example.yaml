  goibibo:
    label: Goibibo
    enabled: false
    allowed_domains: ["goibibo.com"]
    # roomString = rooms-adults-children
    search_url: "https://www.goibibo.com/hotels/hotel-details/?checkin={checkin}&checkout={checkout}&roomString=1-{adults}-0&locusId=CTKUU&locusType=city&cityCode=CTKUU&cc=IN&_uCurrency=INR&giHotelId=2508145749391752109&mmtId=202004271355036572"
    date_format: "%Y%m%d"
    # Goibibo blocked the Firecrawl read. It shares MMT's listing (mmtId), so
