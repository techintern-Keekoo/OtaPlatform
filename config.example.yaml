# Keekoo OTA Rate Parity Agent - example configuration.
#
# Copy to config.yaml (gitignored) and replace EVERY "TODO" value after
# inspecting the live pages. The agent refuses to run while an enabled site
# still contains "TODO". Nothing site-specific here has been verified yet.
#
# Secrets (WATI token, Google service account, sheet id) are NOT set here;
# they come from .env.

property:
  name: "Zen Manali by Keekoo Stays"

# OTA final may be up to this many percent below the website final before it
# counts as a VIOLATION. TODO-confirm with management (value below is a guess).
tolerance_pct: 1.0

stay:
  days_ahead: [7, 30]   # check-in dates = today (IST) + each value
  nights: 1
  adults: 2

# Canonical rate plans to track: the website's 5 room categories (eZee, seen
# 2026-10-08). An OTA price is only compared for the SAME room + meal plan +
# cancellation policy. "Room only" + "Free cancellation" is the plan every OTA
# showed for these rooms on 22 Oct. Confirmed by Keekoo on 2026-10-08:
# compare Room only + Free cancellation only.
rooms:
  - id: standard_garden
    room: Standard garden view room
    meal_plan: Room only
    cancellation: Free cancellation
  - id: deluxe_valley
    room: Deluxe valley facing room
    meal_plan: Room only
    cancellation: Free cancellation
  - id: deluxe_mountain
    room: Deluxe mountain view room
    meal_plan: Room only
    cancellation: Free cancellation
  - id: family_suite
    room: Family Suite with Mountain View Room
    meal_plan: Room only
    cancellation: Free cancellation
  - id: premium_cottage
    room: Premium cottage Mountain View Room
    meal_plan: Room only
    cancellation: Free cancellation

browser:
  # Dedicated profile directory used ONLY by this agent. A human logs in to
  # each OTA once with `python -m rate_parity login`. Never point this at
  # your personal Chrome profile.
  profile_dir: chrome-profile
  channel: chrome          # installed Google Chrome; set to null for bundled Chromium
  headless: false          # OTAs are more likely to show CAPTCHA when headless
  timeout_ms: 30000
  delay_seconds: [5, 12]   # random polite pause before every page load / click

network:
  # Payment gateways (razorpay, payu, paytm, stripe, adyen, juspay, ccavenue,
  # billdesk, cashfree, checkout.com, braintree, paypal) are ALWAYS blocked.
  # Add more host keywords here; you cannot remove the built-in ones.
  extra_payment_host_keywords: []
  # EXACT paths of search endpoints checked to be read-only. They skip the
  # commit_path rule below only; payment hosts and booking-body keywords still
  # apply. eZee loads its room search with POST /booking/multibox.php
  # (body: action=destination_list&checkIn=..&isroomsearch=1).
  readonly_post_paths:
    - /booking/multibox.php
  # Any non-GET request whose URL path contains one of these is aborted.
  # NOTE: if an OTA reaches its summary page via a POST to one of these paths,
  # the deep check will fail safely (COULD_NOT_CHECK); review before changing.
  commit_path_patterns:
    - /book
    - /confirm
    - /payment
    - /pay/
    - /reservation/create
    - /checkout/complete
    - /order

output:
  screenshot_dir: screenshots
  csv_path: output/rate_parity.csv
  sheet_worksheet: checks

alerts:
  # UNVERIFIED: must equal the {{placeholder}} name in the approved WATI template.
  template_param_name: summary
  include_could_not_check: true   # open question: send blocked checks or not
  max_chars: 900                  # WhatsApp template parameters are length-limited

# ---------------------------------------------------------------------------
# Sites. Selectors are CSS/Playwright selectors. `steps` are the ONLY elements
# the agent may click, in order, to go from the search/room page to the booking
# SUMMARY page. The agent never types anything, so it stops at the summary.
# Any step whose label reads like pay/confirm/submit/card/upi/wallet is refused.
# ---------------------------------------------------------------------------
sites:
  # Selector values starting "TODO-verify:" are CANDIDATES read from a
  # Firecrawl scrape (docs/site-findings.md). Check each in the agent's Chrome
  # (DevTools > Elements), then delete the "TODO-verify: " prefix. The agent
  # refuses to run while any enabled site still contains "TODO".
  #
  # room_template: written once per site; {room} {meal_plan} {cancellation} are
  # replaced by each room's labels below. Labels are how THAT site words it.
  website:
    label: Keekoo website
    enabled: true
    # zenhotels.in "Book Now" -> eZee (Yanolja) engine on book.zenhotels.in
    # (CNAME of live.ipms247.com). Rates shown "Exclusive of Tax".
    allowed_domains: ["book.zenhotels.in"]
    # TODO: eZee IGNORED ?checkin=22-10-2026 and ?checkin=2026-10-22&nonights=1
    # (always opened on today). Needs the eZee rate API or a deep-link param.
    search_url: "https://book.zenhotels.in/booking/roomlist-zenmanalibykeekoostays-be?TODO-date-param={checkin}"
    date_format: "%d-%m-%Y"
    logged_in_marker: null          # website deep check is done as a guest
    login_wall_selectors: []
    captcha_selectors: []
    block_texts: []
    room_template:
      steps:
        - "TODO: open this room's 1-night rate plan"
        - "TODO: Book Now for that plan (leads to summary, not payment)"
      summary:
        ready: "TODO: selector only present on the booking summary page"
        room_name: "TODO"
        meal_plan: "TODO"
        cancellation: "TODO"
        room_price: "TODO"
        gst: "TODO"
        fees: null
        discount: null
        final: "TODO: total payable incl. taxes"
    rooms:
      # eZee room-type ids (stable). CAUTION: #roomtype_<id> shows the room's
      # LOWEST rate, which on 8 Oct was a 3-night-minimum deal (Rs 1,363.44)
      # while the 1-night rate was Rs 1,468.32. search_price must point at the
      # 1-night plan, or every check would raise false violations.
      standard_garden:
        search_price: "TODO-verify: 1-night plan price for room id 4757200000000000001 (#roomtype_4757200000000000001 = lowest incl. min-stay deals)"
      deluxe_valley:
        search_price: "TODO-verify: 1-night plan price for room id 4757200000000000002"
      deluxe_mountain:
        search_price: "TODO-verify: 1-night plan price for room id 4757200000000000003"
      family_suite:
        search_price: "TODO-verify: 1-night plan price for room id 4757200000000000005"
      premium_cottage:
        search_price: "TODO-verify: 1-night plan price for room id 4757200000000000006"

  booking_com:
    label: Booking.com
    enabled: true
    allowed_domains: ["booking.com"]
    # From the property link; affiliate/session params (aid, label, sid, srpvid, blocks) removed.
    search_url: "https://www.booking.com/hotel/in/keekoo-manali-manali.html?checkin={checkin}&checkout={checkout}&group_adults={adults}&group_children=0&no_rooms=1&req_adults={adults}&req_children=0"
