        room_name: "TODO-verify: .hprt-table tr:has(.hprt-roomtype-link:has-text('{room}')) .hprt-roomtype-link"
        meal_plan: "TODO-verify: .hprt-table tr:has(.hprt-roomtype-link:has-text('{room}')) .hprt-conditions"
        cancellation: "TODO-verify: .hprt-table tr:has(.hprt-roomtype-link:has-text('{room}')) [data-testid='cancellation-policy']"
        room_price: "TODO-verify: .hprt-table tr:has(.hprt-roomtype-link:has-text('{room}')) .bui-price-display__value"
        gst: "TODO-verify: .hprt-table tr:has(.hprt-roomtype-link:has-text('{room}')) [data-testid='prd-taxes-and-fees-under-price']"
        fees: null
        discount: null
        final: null   # table shows no total: final = room price + taxes, both read from the page
    # Room matches confirmed by Keekoo on 2026-10-08 (evidence: docs/site-findings.md).
    rooms:
      standard_garden:
        labels: {room: "Deluxe Room", meal_plan: "TODO-verify", cancellation: "Free cancellation"}
      deluxe_valley:
        labels: {room: "Deluxe Double Room", meal_plan: "TODO-verify", cancellation: "Free cancellation"}
      deluxe_mountain:
        labels: {room: "Double Room with Mountain View", meal_plan: "TODO-verify", cancellation: "Free cancellation"}
      family_suite:
        labels: {room: "Superior Family Room", meal_plan: "TODO-verify", cancellation: "Free cancellation"}
      premium_cottage:
        labels: {room: "Superior Chalet", meal_plan: "TODO-verify", cancellation: "Free cancellation"}

