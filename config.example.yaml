        final: "TODO: total payable incl. taxes"
    rooms:
      standard_garden:
        labels: {room: "Standard Garden View Room", meal_plan: "TODO: MMT meal wording", cancellation: "Free cancellation"}
      deluxe_valley:
        labels: {room: "Deluxe Valley Facing Room", meal_plan: "TODO: MMT meal wording", cancellation: "Free cancellation"}
      deluxe_mountain:
